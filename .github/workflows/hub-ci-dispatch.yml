name: Hub CI dispatch

on:
  workflow_dispatch:
    inputs:
      checkout_sha:
        description: Commit on private home-dashboard to verify
        required: true
        type: string
      head_ref:
        description: Branch name (optional, for logs)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: hub-ci-${{ inputs.checkout_sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London
      HOME_DASHBOARD_REPO: ${{ secrets.HOME_DASHBOARD_REPO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ secrets.HOME_DASHBOARD_REPO }}
          token: ${{ secrets.HOME_DASHBOARD_DISPATCH_TOKEN }}
          ref: ${{ inputs.checkout_sha }}

      - name: Start commit status (test)
        env:
          PRIVATE_REPO_GITHUB_TOKEN: ${{ secrets.HOME_DASHBOARD_DISPATCH_TOKEN }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INPUT_CHECKOUT_SHA: ${{ inputs.checkout_sha }}
        run: node scripts/run-private-ci-check.mjs start test "${INPUT_CHECKOUT_SHA}" "$DETAILS_URL"

      - uses: ./.github/actions/monorepo-ci
        with:
          suite: test

      - name: Complete commit status (test)
        if: always()
        env:
          PRIVATE_REPO_GITHUB_TOKEN: ${{ secrets.HOME_DASHBOARD_DISPATCH_TOKEN }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONCLUSION: ${{ job.status == 'success' && 'success' || 'failure' }}
          INPUT_CHECKOUT_SHA: ${{ inputs.checkout_sha }}
        run: node scripts/run-private-ci-check.mjs finish test "${INPUT_CHECKOUT_SHA}" "$CONCLUSION" "$DETAILS_URL"

  hub-smoke:
    name: Hub smoke (demo)
    runs-on: ubuntu-latest
    # Normally ~7 min. A hang on 2026-10-22 sat for 90 min and blocked Deploy on merge.
    timeout-minutes: 30
    env:
      TZ: Europe/London
      HOME_DASHBOARD_REPO: ${{ secrets.HOME_DASHBOARD_REPO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ secrets.HOME_DASHBOARD_REPO }}
          token: ${{ secrets.HOME_DASHBOARD_DISPATCH_TOKEN }}
          ref: ${{ inputs.checkout_sha }}

      - name: Start commit status (Hub smoke)
        env:
          PRIVATE_REPO_GITHUB_TOKEN: ${{ secrets.HOME_DASHBOARD_DISPATCH_TOKEN }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INPUT_CHECKOUT_SHA: ${{ inputs.checkout_sha }}
        run: node scripts/run-private-ci-check.mjs start "Hub smoke (demo)" "${INPUT_CHECKOUT_SHA}" "$DETAILS_URL"

      - uses: ./.github/actions/monorepo-ci
        with:
          suite: smoke
          demo-test-bypass: ${{ secrets.DEMO_TEST_BYPASS }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: hub-smoke-playwright-report-${{ inputs.checkout_sha }}
          # Screenshots and error notes only (#1169): traces, videos and the HTML report carry
          # request headers and cookies, and anyone can download artifacts on this public repo.
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
          retention-days: 7
          if-no-files-found: ignore

      - name: Complete commit status (Hub smoke)
        if: always()
        env:
          PRIVATE_REPO_GITHUB_TOKEN: ${{ secrets.HOME_DASHBOARD_DISPATCH_TOKEN }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONCLUSION: ${{ job.status == 'success' && 'success' || 'failure' }}
          INPUT_CHECKOUT_SHA: ${{ inputs.checkout_sha }}
        run: node scripts/run-private-ci-check.mjs finish "Hub smoke (demo)" "${INPUT_CHECKOUT_SHA}" "$CONCLUSION" "$DETAILS_URL"

  site-checks:
    name: Site checks
    runs-on: ubuntu-latest
    env:
      HOME_DASHBOARD_REPO: ${{ secrets.HOME_DASHBOARD_REPO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ secrets.HOME_DASHBOARD_REPO }}
          token: ${{ secrets.HOME_DASHBOARD_DISPATCH_TOKEN }}
          ref: ${{ inputs.checkout_sha }}

      - name: Start commit status (Site checks)
        env:
          PRIVATE_REPO_GITHUB_TOKEN: ${{ secrets.HOME_DASHBOARD_DISPATCH_TOKEN }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INPUT_CHECKOUT_SHA: ${{ inputs.checkout_sha }}
        run: node scripts/run-private-ci-check.mjs start "Site checks" "${INPUT_CHECKOUT_SHA}" "$DETAILS_URL"

      # Marketing site + account pages against the real platform API code, run locally (#1108).
      - uses: ./.github/actions/monorepo-ci
        with:
          suite: site

      - name: Complete commit status (Site checks)
        if: always()
        env:
          PRIVATE_REPO_GITHUB_TOKEN: ${{ secrets.HOME_DASHBOARD_DISPATCH_TOKEN }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONCLUSION: ${{ job.status == 'success' && 'success' || 'failure' }}
          INPUT_CHECKOUT_SHA: ${{ inputs.checkout_sha }}
        run: node scripts/run-private-ci-check.mjs finish "Site checks" "${INPUT_CHECKOUT_SHA}" "$CONCLUSION" "$DETAILS_URL"

  hub-visual:
    name: Hub visual
    # Pinned: baselines depend on the OS fonts; ubuntu-latest moves to 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    env:
      TZ: Europe/London
      HOME_DASHBOARD_REPO: ${{ secrets.HOME_DASHBOARD_REPO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ secrets.HOME_DASHBOARD_REPO }}
          token: ${{ secrets.HOME_DASHBOARD_DISPATCH_TOKEN }}
          ref: ${{ inputs.checkout_sha }}

      - name: Start commit status (Hub visual)
        env:
          PRIVATE_REPO_GITHUB_TOKEN: ${{ secrets.HOME_DASHBOARD_DISPATCH_TOKEN }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INPUT_CHECKOUT_SHA: ${{ inputs.checkout_sha }}
        run: node scripts/run-private-ci-check.mjs start "Hub visual" "${INPUT_CHECKOUT_SHA}" "$DETAILS_URL"

      - uses: ./.github/actions/monorepo-ci
        with:
          suite: visual

      # On failure, test-results/ holds *-actual.png and *-diff.png for each changed screen.
      # If the change is intended, copy the -actual.png files over e2e/hub-visual.spec.js-snapshots/.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: hub-visual-diff-${{ inputs.checkout_sha }}
          # Screenshots and error notes only (#1169): traces, videos and the HTML report carry
          # request headers and cookies, and anyone can download artifacts on this public repo.
          path: |
            test-results/**/*.png
            test-results/**/error-context.md
          retention-days: 7
          if-no-files-found: ignore

      - name: Complete commit status (Hub visual)
        if: always()
        env:
          PRIVATE_REPO_GITHUB_TOKEN: ${{ secrets.HOME_DASHBOARD_DISPATCH_TOKEN }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONCLUSION: ${{ job.status == 'success' && 'success' || 'failure' }}
          INPUT_CHECKOUT_SHA: ${{ inputs.checkout_sha }}
        run: node scripts/run-private-ci-check.mjs finish "Hub visual" "${INPUT_CHECKOUT_SHA}" "$CONCLUSION" "$DETAILS_URL"
