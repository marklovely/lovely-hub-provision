name: Hub lifecycle dispatch

on:
  # Nightly at 02:00 UTC is dispatched by the production hub-jobs Worker's Cloudflare cron
  # (#1121) — GitHub's own schedule started this ~5 hours late every night.
  workflow_dispatch:
    inputs:
      signup_plan:
        description: free, plus, or both (serial when both)
        required: false
        default: both
        type: choice
        options:
          - both
          - free
          - plus
      checkout_ref:
        description: home-dashboard ref to test (branch, tag, or SHA)
        required: false
        default: main
        type: string
      platform_api_origin:
        description: Platform API base URL (sandbox = test Stripe)
        required: false
        default: https://platform-sandbox.lovely-home.co.uk
        type: string
      marketing_origin:
        description: Marketing site origin (Plus checkout success URLs)
        required: false
        default: https://marketing-sandbox.lovely-home.co.uk
        type: string
      deploy_sandbox:
        description: Deploy checkout_ref to marketing-sandbox + platform-sandbox first
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: hub-lifecycle-nightly
  cancel-in-progress: false

jobs:
  resolve-plans:
    runs-on: ubuntu-latest
    outputs:
      signup_plans: ${{ steps.plans.outputs.json }}
      checkout_ref: ${{ steps.ref.outputs.ref }}
    steps:
      - id: ref
        run: |
          REF="$(printf '%s' '${{ inputs.checkout_ref }}' | tr -d '[:space:]')"
          echo "ref=${REF:-main}" >> "$GITHUB_OUTPUT"

      - id: plans
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo 'json=["free","plus"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PLAN="$(printf '%s' '${{ inputs.signup_plan }}' | tr '[:upper:]' '[:lower:]')"
          case "$PLAN" in
            free|plus) echo "json=[\"$PLAN\"]" >> "$GITHUB_OUTPUT" ;;
            both|"") echo 'json=["free","plus"]' >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Invalid signup_plan: $PLAN"
              exit 1
              ;;
          esac

  deploy-sandbox:
    name: Deploy ref to sandbox
    needs: resolve-plans
    # Scheduled runs have no inputs: deploy (main). Manual runs: unless deploy_sandbox is off.
    if: github.event_name == 'schedule' || inputs.deploy_sandbox != false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # The one commit sandbox runs for this whole run (#1135).
      sha: ${{ steps.sha.outputs.sha }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_BRANCH: sandbox
      SANDBOX_MARKETING_PAGES_PRODUCTION_BRANCH: main
      LOVELY_STACK: sandbox
      PLATFORM_MANIFEST_SANDBOX: '1'
      SANDBOX_MARKETING_PAGES_PROJECT: lovely-home-sandbox
      SANDBOX_PLATFORM_PAGES_PROJECT: home-dashboard-platform-sandbox
      SANDBOX_MARKETING_SITE_ORIGIN: https://marketing-sandbox.lovely-home.co.uk
      SANDBOX_PLATFORM_SITE_ORIGIN: https://platform-sandbox.lovely-home.co.uk
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.HOME_DASHBOARD_REPO }}
          token: ${{ secrets.HOME_DASHBOARD_DISPATCH_TOKEN }}
          ref: ${{ needs.resolve-plans.outputs.checkout_ref }}

      - uses: ./.github/actions/setup-node

      - run: npm ci

      # Same script as the private "Deploy sandbox Lovely Home" workflow.
      - name: Deploy marketing-sandbox + platform-sandbox
        run: bash scripts/deploy-sandbox-lovely-home.sh

      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  lifecycle:
    name: Lifecycle (${{ matrix.signup_plan }})
    needs: [resolve-plans, deploy-sandbox]
    # Run when the sandbox deploy succeeded or was switched off — never on a half-deployed sandbox.
    if: >-
      always() && needs.resolve-plans.result == 'success' &&
      (needs.deploy-sandbox.result == 'success' || needs.deploy-sandbox.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      # Each plan reports on its own: a Free failure used to cancel Plus mid-run (#1112).
      fail-fast: false
      max-parallel: 1
      matrix:
        signup_plan: ${{ fromJson(needs.resolve-plans.outputs.signup_plans) }}
    env:
      TZ: Europe/London
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
      STRIPE_MODE: test
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_IMAP_HOST: imap.gmx.com
      E2E_IMAP_PORT: '993'
      E2E_IMAP_USER: ${{ secrets.E2E_IMAP_USER }}
      E2E_IMAP_PASSWORD: ${{ secrets.E2E_IMAP_PASSWORD }}
      E2E_PLUS_CHECKOUT_COUPON_ID: ${{ secrets.E2E_PLUS_CHECKOUT_COUPON_ID }}
      E2E_SIGNUP_PLAN: ${{ matrix.signup_plan }}
      PLATFORM_API_ORIGIN: ${{ inputs.platform_api_origin || 'https://platform-sandbox.lovely-home.co.uk' }}
      MARKETING_ORIGIN: ${{ inputs.marketing_origin || 'https://marketing-sandbox.lovely-home.co.uk' }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ secrets.HOME_DASHBOARD_REPO }}
          token: ${{ secrets.HOME_DASHBOARD_DISPATCH_TOKEN }}
          ref: ${{ needs.resolve-plans.outputs.checkout_ref }}

      - uses: ./.github/actions/setup-node

      - name: Validate sandbox test Stripe
        run: |
          set -euo pipefail
          echo "Platform API: ${PLATFORM_API_ORIGIN}"
          echo "Marketing origin: ${MARKETING_ORIGIN}"
          echo "Signup plan: ${E2E_SIGNUP_PLAN}"
          case "${STRIPE_SECRET_KEY:-}" in
            sk_test_*|rk_test_*) ;;
            sk_live_*|rk_live_*)
              echo "::error::STRIPE_SECRET_KEY is a live key. This workflow only runs against Stripe test mode."
              exit 1
              ;;
            "")
              echo "::error::STRIPE_SECRET_KEY is missing. Add the test-mode GitHub secret on this repo."
              exit 1
              ;;
            *)
              echo "::error::STRIPE_SECRET_KEY must be a Stripe test key (sk_test_ / rk_test_)."
              exit 1
              ;;
          esac
          if [ -z "${E2E_OWNER_EMAIL:-}" ]; then
            echo "::error::Add repo secret E2E_OWNER_EMAIL."
            exit 1
          fi
          if [ -z "${E2E_IMAP_PASSWORD:-}" ]; then
            echo "::error::Add repo secret E2E_IMAP_PASSWORD (GMX IMAP password or app-specific password)."
            exit 1
          fi
          if [ -z "${E2E_IMAP_USER:-}" ]; then
            echo "E2E_IMAP_USER unset — lifecycle will default IMAP auth to E2E_OWNER_EMAIL."
          fi
          PLAN="$(printf '%s' "${E2E_SIGNUP_PLAN:-free}" | tr '[:upper:]' '[:lower:]')"
          if [ "$PLAN" = "plus" ] && [ -z "${STRIPE_PRICE_ID:-}" ]; then
            echo "::error::STRIPE_PRICE_ID is required when signup_plan is plus."
            exit 1
          fi

      - run: npm ci

      - run: npx playwright install chromium --with-deps

      # One commit for the whole run (#1135): platform-sandbox must serve the commit the
      # deploy job put there (or, with deploy_sandbox off, the one it serves now) before
      # and after the plan. Its test homes are built from that same commit (#1129).
      - name: Sandbox runs the commit under test
        id: sandbox_commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYED_SHA: ${{ needs.deploy-sandbox.outputs.sha }}
        run: |
          set -euo pipefail
          SHA="${DEPLOYED_SHA:-$(node scripts/lib/pages-production-deploy.mjs live-commit --project home-dashboard-platform-sandbox)}"
          node scripts/lib/pages-production-deploy.mjs verify --project home-dashboard-platform-sandbox --commit "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "::notice::Testing ${SHA:0:12} on platform-sandbox and its test homes."

      - run: npm run test:lifecycle

      - name: Sandbox stayed on the commit under test
        if: always() && steps.sandbox_commit.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/lib/pages-production-deploy.mjs verify --project home-dashboard-platform-sandbox --commit "${{ steps.sandbox_commit.outputs.sha }}"

      - name: Upload Playwright report to R2
        id: e2e_report_r2
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          E2E_REPORTS_R2_BUCKET: ${{ secrets.E2E_REPORTS_R2_BUCKET }}
          E2E_REPORTS_PUBLIC_BASE_URL: ${{ secrets.E2E_REPORTS_PUBLIC_BASE_URL }}
        run: node scripts/upload-e2e-playwright-report-r2.mjs

      - name: Playwright job summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SIGNUP_PLAN: ${{ matrix.signup_plan }}
          artifact_url: ${{ steps.e2e_report_r2.outputs.artifact_url }}
        run: node scripts/write-playwright-run-summary.mjs

      - name: Record lifecycle run (platform API)
        if: always()
        env:
          PLATFORM_API_ORIGIN: ${{ env.PLATFORM_API_ORIGIN }}
          E2E_LIFECYCLE_CF_ACCESS_CLIENT_ID: ${{ secrets.E2E_LIFECYCLE_CF_ACCESS_CLIENT_ID }}
          E2E_LIFECYCLE_CF_ACCESS_CLIENT_SECRET: ${{ secrets.E2E_LIFECYCLE_CF_ACCESS_CLIENT_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_CONCLUSION: ${{ job.status }}
          artifact_url: ${{ steps.e2e_report_r2.outputs.artifact_url }}
        run: node scripts/post-e2e-lifecycle-run.mjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.signup_plan }}-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          retention-days: 30
          if-no-files-found: ignore
