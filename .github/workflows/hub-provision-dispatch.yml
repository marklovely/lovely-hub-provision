name: Hub provision dispatch

on:
  workflow_dispatch:
    inputs:
      site_id:
        description: Site id (e.g. rose-cottage)
        required: true
        type: string
      job_action:
        description: provision or teardown
        required: true
        type: choice
        options:
          - provision
          - teardown
      skip_pages:
        description: Skip Pages frontend deploy (provision only)
        required: false
        type: boolean
        default: false
      skip_platform_admin:
        description: Skip platform admin redeploy (provision only)
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hub-provision-dispatch-${{ inputs.job_action }}-${{ inputs.site_id }}
  cancel-in-progress: false

jobs:
  resolve-stack:
    runs-on: ubuntu-latest
    outputs:
      terraform_stack: ${{ steps.resolve.outputs.terraform_stack }}
      checkout_ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Resolve private repo ref
        id: ref
        shell: bash
        env:
          RAW_REF: ${{ secrets.HOME_DASHBOARD_REF }}
        run: |
          REF="$(printf '%s' "${RAW_REF:-}" | tr -d '[:space:]')"
          echo "ref=${REF:-main}" >> "$GITHUB_OUTPUT"

      - name: Validate HOME_DASHBOARD_REPO
        shell: bash
        env:
          REPO: ${{ secrets.HOME_DASHBOARD_REPO }}
          TOKEN: ${{ secrets.HOME_DASHBOARD_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          REPO="$(printf '%s' "${REPO:-}" | tr -d '[:space:]')"
          if [ -z "${TOKEN:-}" ] || [ -z "${REPO:-}" ]; then
            echo "HOME_DASHBOARD_DISPATCH_TOKEN and HOME_DASHBOARD_REPO must be set."
            exit 1
          fi
          case "$REPO" in
            */*) ;;
            *)
              echo "HOME_DASHBOARD_REPO must be owner/name (e.g. marklovely/home-dashboard)."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v5
        with:
          repository: ${{ secrets.HOME_DASHBOARD_REPO }}
          token: ${{ secrets.HOME_DASHBOARD_DISPATCH_TOKEN }}
          ref: ${{ steps.ref.outputs.ref }}

      - uses: ./.github/actions/setup-node

      - id: resolve
        env:
          SITE_ID: ${{ inputs.site_id }}
        run: |
          STACK=$(node scripts/terraform-stack-for-site.mjs "$SITE_ID" --guess)
          echo "terraform_stack=$STACK" >> "$GITHUB_OUTPUT"

  hub-provision:
    if: inputs.job_action == 'provision'
    needs: resolve-stack
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ needs.resolve-stack.outputs.terraform_stack == 'customers' && format('platform-terraform-state-customers-{0}', inputs.site_id) || format('platform-terraform-state-{0}', needs.resolve-stack.outputs.terraform_stack) }}
      cancel-in-progress: false
    env:
      TZ: Europe/London
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CUSTOMER_CLOUDFLARE_ZONE_ID: ${{ secrets.CUSTOMER_CLOUDFLARE_ZONE_ID }}
      CUSTOMER_ZONE_NAME: ${{ secrets.CUSTOMER_ZONE_NAME }}
      WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
      ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
      OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
      SUPPORT_OWNER_EMAILS: ${{ secrets.SUPPORT_OWNER_EMAILS }}
      PLATFORM_OPERATOR_EMAILS: ${{ secrets.PLATFORM_OPERATOR_EMAILS }}
      SITTER_EMAILS: ${{ secrets.SITTER_EMAILS }}
      PLATFORM_GITHUB_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
      PLATFORM_CF_API_TOKEN: ${{ secrets.PLATFORM_CF_API_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
      STRIPE_PRICE_ID_YEARLY: ${{ secrets.STRIPE_PRICE_ID_YEARLY }}
      STRIPE_SECRET_KEY_LIVE: ${{ secrets.STRIPE_SECRET_KEY_LIVE }}
      STRIPE_WEBHOOK_SECRET_LIVE: ${{ secrets.STRIPE_WEBHOOK_SECRET_LIVE }}
      STRIPE_PRICE_ID_LIVE: ${{ secrets.STRIPE_PRICE_ID_LIVE }}
      STRIPE_PRICE_ID_YEARLY_LIVE: ${{ secrets.STRIPE_PRICE_ID_YEARLY_LIVE }}
      STRIPE_REFERRAL_COUPON_MONTHLY: ${{ secrets.STRIPE_REFERRAL_COUPON_MONTHLY }}
      STRIPE_REFERRAL_COUPON_YEARLY: ${{ secrets.STRIPE_REFERRAL_COUPON_YEARLY }}
      STRIPE_REFERRAL_COUPON_MONTHLY_LIVE: ${{ secrets.STRIPE_REFERRAL_COUPON_MONTHLY_LIVE }}
      STRIPE_REFERRAL_COUPON_YEARLY_LIVE: ${{ secrets.STRIPE_REFERRAL_COUPON_YEARLY_LIVE }}
      STRIPE_INTRO_COUPON_MONTHLY: ${{ secrets.STRIPE_INTRO_COUPON_MONTHLY }}
      STRIPE_INTRO_COUPON_YEARLY: ${{ secrets.STRIPE_INTRO_COUPON_YEARLY }}
      STRIPE_INTRO_COUPON_MONTHLY_LIVE: ${{ secrets.STRIPE_INTRO_COUPON_MONTHLY_LIVE }}
      STRIPE_INTRO_COUPON_YEARLY_LIVE: ${{ secrets.STRIPE_INTRO_COUPON_YEARLY_LIVE }}
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CUSTOMER_EMAIL_FROM: ${{ secrets.CUSTOMER_EMAIL_FROM }}
      HUB_PROXY_SECRETS_JSON: ${{ secrets.HUB_PROXY_SECRETS_JSON }}
      PLATFORM_SITE_ARCHIVE_SECRET: ${{ secrets.PLATFORM_SITE_ARCHIVE_SECRET }}
      PLATFORM_HEALTH_CF_ACCESS_CLIENT_ID: ${{ secrets.PLATFORM_HEALTH_CF_ACCESS_CLIENT_ID }}
      PLATFORM_HEALTH_CF_ACCESS_CLIENT_SECRET: ${{ secrets.PLATFORM_HEALTH_CF_ACCESS_CLIENT_SECRET }}
      PLATFORM_ARCHIVE_R2_BUCKET: lovely-home-hub-archives
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      OS_PLACES_API_KEY: ${{ secrets.OS_PLACES_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
      TF_STATE_R2_BUCKET: ${{ secrets.TF_STATE_R2_BUCKET }}
      TF_STATE_R2_ENDPOINT: ${{ secrets.TF_STATE_R2_ENDPOINT }}
      TERRAFORM_STACK: ${{ needs.resolve-stack.outputs.terraform_stack }}
      TF_VAR_terraform_stack: ${{ needs.resolve-stack.outputs.terraform_stack }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ secrets.HOME_DASHBOARD_REPO }}
          token: ${{ secrets.HOME_DASHBOARD_DISPATCH_TOKEN }}
          ref: ${{ needs.resolve-stack.outputs.checkout_ref }}

      - uses: ./.github/actions/hub-manual-provision
        with:
          site_id: ${{ inputs.site_id }}
          terraform_stack: ${{ needs.resolve-stack.outputs.terraform_stack }}
          skip_pages: ${{ inputs.skip_pages }}
          skip_platform_admin: ${{ inputs.skip_platform_admin }}

  hub-teardown:
    if: inputs.job_action == 'teardown'
    needs: resolve-stack
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ needs.resolve-stack.outputs.terraform_stack == 'customers' && format('platform-terraform-state-customers-{0}', inputs.site_id) || format('platform-terraform-state-{0}', needs.resolve-stack.outputs.terraform_stack) }}
      cancel-in-progress: false
    env:
      TZ: Europe/London
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CUSTOMER_CLOUDFLARE_ZONE_ID: ${{ secrets.CUSTOMER_CLOUDFLARE_ZONE_ID }}
      CUSTOMER_ZONE_NAME: ${{ secrets.CUSTOMER_ZONE_NAME }}
      WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
      ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
      OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
      SUPPORT_OWNER_EMAILS: ${{ secrets.SUPPORT_OWNER_EMAILS }}
      PLATFORM_OPERATOR_EMAILS: ${{ secrets.PLATFORM_OPERATOR_EMAILS }}
      SITTER_EMAILS: ${{ secrets.SITTER_EMAILS }}
      HUB_PROXY_SECRETS_JSON: ${{ secrets.HUB_PROXY_SECRETS_JSON }}
      PLATFORM_GITHUB_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
      PLATFORM_CF_API_TOKEN: ${{ secrets.PLATFORM_CF_API_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
      STRIPE_PRICE_ID_YEARLY: ${{ secrets.STRIPE_PRICE_ID_YEARLY }}
      STRIPE_SECRET_KEY_LIVE: ${{ secrets.STRIPE_SECRET_KEY_LIVE }}
      STRIPE_WEBHOOK_SECRET_LIVE: ${{ secrets.STRIPE_WEBHOOK_SECRET_LIVE }}
      STRIPE_PRICE_ID_LIVE: ${{ secrets.STRIPE_PRICE_ID_LIVE }}
      STRIPE_PRICE_ID_YEARLY_LIVE: ${{ secrets.STRIPE_PRICE_ID_YEARLY_LIVE }}
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CUSTOMER_EMAIL_FROM: ${{ secrets.CUSTOMER_EMAIL_FROM }}
      PLATFORM_SITE_ARCHIVE_SECRET: ${{ secrets.PLATFORM_SITE_ARCHIVE_SECRET }}
      PLATFORM_HEALTH_CF_ACCESS_CLIENT_ID: ${{ secrets.PLATFORM_HEALTH_CF_ACCESS_CLIENT_ID }}
      PLATFORM_HEALTH_CF_ACCESS_CLIENT_SECRET: ${{ secrets.PLATFORM_HEALTH_CF_ACCESS_CLIENT_SECRET }}
      PLATFORM_ARCHIVE_R2_BUCKET: ${{ secrets.PLATFORM_ARCHIVE_R2_BUCKET }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      OS_PLACES_API_KEY: ${{ secrets.OS_PLACES_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
      TF_STATE_R2_BUCKET: ${{ secrets.TF_STATE_R2_BUCKET }}
      TF_STATE_R2_ENDPOINT: ${{ secrets.TF_STATE_R2_ENDPOINT }}
      TERRAFORM_STACK: ${{ needs.resolve-stack.outputs.terraform_stack }}
      TF_VAR_terraform_stack: ${{ needs.resolve-stack.outputs.terraform_stack }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ secrets.HOME_DASHBOARD_REPO }}
          token: ${{ secrets.HOME_DASHBOARD_DISPATCH_TOKEN }}
          ref: ${{ needs.resolve-stack.outputs.checkout_ref }}
          fetch-depth: 0

      - uses: ./.github/actions/billing-deprovision-hub
        with:
          site_id: ${{ inputs.site_id }}
          terraform_stack: ${{ needs.resolve-stack.outputs.terraform_stack }}
